# Tests of the HackWin CLI, on every pull request and every push to main.
# The job "node" runs `npm ci` and `npm test` on Node 22, the minimum, and on Node 24.
# The job "test" is the required check on main: it fails unless every run of "node"
# succeeded, so a failed, cancelled or skipped run never counts as passing.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  test:
    needs: node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Node run succeeded
        env:
          RESULT: ${{ needs.node.result }}
        run: |
          echo "Result of the Node 22 and 24 runs: $RESULT"
          test "$RESULT" = success
