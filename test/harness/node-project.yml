  owners.yml: |
    # Ownership map: path globs to ownership roles.
    #
    # One directory per feature role, everything else shared.
    #
    # - A path matches at most one role. Globs must not overlap.
    # - A path that matches no role and no open entry belongs to the shared role,
    #   so every file always has exactly one owner.
    # - The role flagged shared: true is held by the Lead. It covers shared code,
    #   infrastructure, contracts, dependencies and configuration.
    # - Every role has exactly one holder at a time; a member may hold several.
    #   Who holds which role is written in the Team section of README.md.
    # - Paths under open may be edited by every member.

    schema: 1
    roles:
      shared:
        shared: true                  # exactly one role carries this flag
        paths: ["src/shared/**", "docs/**", ".github/**"]
      counter:
        paths: ["src/features/counter/**"]
      todos:
        paths: ["src/features/todos/**"]
      greeting:
        paths: ["src/features/greeting/**"]
    open:                             # paths every member may edit
      - README.md
