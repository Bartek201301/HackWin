  src/features/counter/counter.test.ts: |
    import { describe, expect, it } from "vitest";
    import { increment } from "./counter";

    describe("increment", () => {
      it("adds one by default", () => {
        expect(increment(0)).toBe(1);
      });

      it("adds the given step", () => {
        expect(increment(2, 5)).toBe(7);
      });
    });
  src/features/counter/counter.ts: |
    import type { Feature } from "../../shared/feature";

    export function increment(count: number, step = 1): number {
      return count + step;
    }

    export const counter: Feature = {
      title: "Counter",
      mount(root) {
        let count = 0;
        const button = document.createElement("button");
        button.className = "rounded bg-indigo-600 px-3 py-1 text-white";
        const render = () => (button.textContent = `Clicked ${count} times`);
        button.addEventListener("click", () => {
          count = increment(count);
          render();
        });
        render();
        root.append(button);
      },
    };
  src/features/greeting/greeting.test.ts: |
    import { describe, expect, it } from "vitest";
    import { greet } from "./greeting";

    describe("greet", () => {
      it("greets the given name", () => {
        expect(greet("Ada")).toBe("Hello, Ada!");
      });

      it("falls back to world for a blank name", () => {
        expect(greet("  ")).toBe("Hello, world!");
      });
    });
  src/features/greeting/greeting.ts: |
    import type { Feature } from "../../shared/feature";

    export function greet(name: string): string {
      return `Hello, ${name.trim() || "world"}!`;
    }

    export const greeting: Feature = {
      title: "Greeting",
      mount(root) {
        const input = document.createElement("input");
        input.className = "w-full rounded border px-2 py-1";
        input.placeholder = "Your name";
        const output = document.createElement("p");
        output.className = "mt-2";
        const render = () => (output.textContent = greet(input.value));
        input.addEventListener("input", render);
        render();
        root.append(input, output);
      },
    };
  src/features/todos/todos.test.ts: |
    import { describe, expect, it } from "vitest";
    import { addTodo } from "./todos";

    describe("addTodo", () => {
      it("appends the trimmed text", () => {
        expect(addTodo(["a"], "  b  ")).toEqual(["a", "b"]);
      });

      it("ignores blank text", () => {
        expect(addTodo(["a"], "   ")).toEqual(["a"]);
      });

      it("does not change the input list", () => {
        const items = ["a"];
        addTodo(items, "b");
        expect(items).toEqual(["a"]);
      });
    });
  src/features/todos/todos.ts: |
    import type { Feature } from "../../shared/feature";

    export function addTodo(items: readonly string[], text: string): string[] {
      const trimmed = text.trim();
      return trimmed ? [...items, trimmed] : [...items];
    }

    export const todos: Feature = {
      title: "Todos",
      mount(root) {
        let items: string[] = [];
        const form = document.createElement("form");
        const input = document.createElement("input");
        input.className = "w-full rounded border px-2 py-1";
        input.placeholder = "Add a todo";
        const list = document.createElement("ul");
        list.className = "mt-2 list-disc pl-5";
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          items = addTodo(items, input.value);
          input.value = "";
          list.replaceChildren(
            ...items.map((item) => {
              const li = document.createElement("li");
              li.textContent = item;
              return li;
            }),
          );
        });
        form.append(input);
        root.append(form, list);
      },
    };
  src/main.ts: |
    import "./style.css";
    import { counter } from "./features/counter/counter";
    import { greeting } from "./features/greeting/greeting";
    import { todos } from "./features/todos/todos";
    import { renderCard } from "./shared/feature";

    const app = document.querySelector<HTMLElement>("#app");
    if (!app) throw new Error("Missing #app element");

    for (const feature of [counter, todos, greeting]) {
      app.append(renderCard(feature));
    }
  src/shared/feature.ts: |
    // The contract between the app shell and every feature area.
    export interface Feature {
      title: string;
      mount(root: HTMLElement): void;
    }

    // Renders a feature inside a card. Owned by the shared role.
    export function renderCard(feature: Feature): HTMLElement {
      const card = document.createElement("section");
      card.className = "rounded-lg bg-white p-4 shadow";
      const heading = document.createElement("h2");
      heading.className = "mb-3 font-semibold";
      heading.textContent = feature.title;
      const body = document.createElement("div");
      card.append(heading, body);
      feature.mount(body);
      return card;
    }
  src/style.css: |
    @import "tailwindcss";
  tsconfig.json: |
    {
      "compilerOptions": {
        "target": "ES2022",
        "module": "ESNext",
        "moduleResolution": "bundler",
        "lib": ["ES2022", "DOM", "DOM.Iterable"],
        "types": ["vite/client"],
        "strict": true,
        "noEmit": true,
        "isolatedModules": true,
        "skipLibCheck": true
      },
      "include": ["src", "vite.config.ts"]
    }
  vite.config.ts: |
    import tailwindcss from "@tailwindcss/vite";
    import { defineConfig } from "vite";

    export default defineConfig({
      plugins: [tailwindcss()],
    });
