    ---
    name: research
    description: Research one question outside the codebase (a library, an API, a service, the event's rules, the domain) and answer it with dated sources. Use it before choosing the stack or writing a contract, and whenever a fact about an external tool is unsure.
    ---

    # Research

    Answer one question with facts you checked, not from memory.

    1. Restate the question in one line. If it holds several questions, answer them one by one.
    2. Prefer primary sources: official documentation, the project's own repository and changelog, the event's published rules. Use other pages only to find primary sources.
    3. Name the version each fact applies to and the date you read the page. Treat old data as historical.
    4. Keep what you verified apart from what you could not verify. Never fill a gap with a guess: say what is missing.
    5. Change no project file. Never read or print `.env`, `.env.local` or any `.env.*.local` file, and never put a secret into a search.
    6. Answer briefly: the answer first, then one line per source (title, link, date read), then the open points.

    When the agent offers a research subagent, hand it long reading, so that the pages stay out of the working conversation.
