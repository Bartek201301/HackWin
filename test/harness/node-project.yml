  .github/workflows/check.yml: |
    # The project's own check, on every pull request and on every push to main.
    # It runs a clean install, the full project check, and a check that no
    # generated file was left uncommitted.
    name: check

    on:
      pull_request:
      push:
        branches: [main]

    permissions:
      contents: read

    jobs:
      check:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v7
          - uses: actions/setup-node@v7
            with:
              node-version: 24
              cache: npm
          - run: npm ci
          - run: npm run check
          - run: git diff --exit-code
