# The project's own check, on every pull request and on every push to main.
# It runs only the project's check. Until the team replaces the placeholder
# step below, it passes without checking anything.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

